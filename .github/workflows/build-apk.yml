name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0

      - name: Flutter version
        run: flutter --version

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-1-dev libjsoncpp-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2G -XX:MaxMetaspaceSize=1G"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
